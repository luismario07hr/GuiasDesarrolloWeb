<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/stylesFunciones.css" rel="stylesheet" />
    <link rel="icon" href="../img/js.png" sizes="32x32" type="image/png" />
    <title>Validación con expresiones regulares</title>
</head>

<body class="bg-light">
    <header>
        <div class="px-3 py-2 text-bg-dark fixed-top">
            <div class="container">
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                    <a href="../indexFunciones.html"
                        class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">
                        <img src="../img/js.png" alt="" width="32" height="32" class="me-2" />
                    </a>

                    <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small nav-bar">
                        <li class="text-center">
                            <a href="./recursividad.html" class="nav-link text-white">
                                <i class="bi bi-arrow-clockwise bi-2 d-block"></i>
                                Recursividad
                            </a>
                        </li>
                        <li class="text-center">
                            <a href="./tabla.html" class="nav-link text-white">
                                <i class="bi bi-table bi-2 d-block"></i>
                                Creando una Tabla
                            </a>
                        </li>
                        <li class="text-center">
                            <a href="./formulario.html" class="nav-link text-white">
                                <i class="bi bi-ui-checks bi-2 d-block"></i>
                                Formulario
                            </a>
                        </li>
                        <li class="text-center">
                            <a href="./validacionEstudiante.html" class="nav-link text-white active">
                                <i class="bi bi-shield-check bi-2 d-block"></i>
                                Nuevo
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <div class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-header bg-white border-bottom py-3 px-4">
                        <h4 class="mb-1 text-primary fw-semibold">
                            <i class="bi bi-card-checklist me-2"></i>Ficha de estudiante
                        </h4>
                        <p class="text-muted small mb-0">Validación de datos mediante expresiones regulares</p>
                    </div>

                    <div class="card-body p-4">
                        <form id="idFormEstudiante" novalidate onsubmit="return false">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="idTxtCarnet" placeholder="Carnet"
                                            maxlength="5" />
                                        <label for="idTxtCarnet"><i class="bi bi-credit-card-2-front text-primary"></i> Carnet (AB001)</label>
                                        <div class="invalid-feedback"></div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="idTxtNombre"
                                            placeholder="Nombre completo" />
                                        <label for="idTxtNombre"><i class="bi bi-person-circle text-primary"></i> Nombre completo</label>
                                        <div class="invalid-feedback"></div>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="idTxtDui" placeholder="DUI"
                                            maxlength="10" />
                                        <label for="idTxtDui"><i class="bi bi-person-vcard text-primary"></i> DUI (########-#)</label>
                                        <div class="invalid-feedback"></div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="idTxtNit" placeholder="NIT"
                                            maxlength="17" />
                                        <label for="idTxtNit"><i class="bi bi-card-text text-primary"></i> NIT (####-######-###-#)</label>
                                        <div class="invalid-feedback"></div>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="idTxtFecha"
                                            placeholder="Fecha de nacimiento" maxlength="10" />
                                        <label for="idTxtFecha"><i class="bi bi-calendar-date text-primary"></i> Fecha de nacimiento (dd/mm/aaaa)</label>
                                        <div class="invalid-feedback"></div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="idTxtEdad" placeholder="Edad"
                                            maxlength="3" />
                                        <label for="idTxtEdad"><i class="bi bi-123 text-primary"></i> Edad</label>
                                        <div class="invalid-feedback"></div>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="idTxtCorreo"
                                            placeholder="Correo electrónico" />
                                        <label for="idTxtCorreo"><i class="bi bi-envelope text-primary"></i> Correo electrónico</label>
                                        <div class="invalid-feedback"></div>
                                    </div>
                                </div>
                            </div>

                            <hr class="my-4 text-muted" />

                            <div class="d-flex justify-content-end gap-2">
                                <button id="idBtnLimpiar" type="button" class="btn btn-outline-danger px-4">
                                    <i class="bi bi-trash me-1"></i> Limpiar formulario
                                </button>
                                <button id="idBtnValidar" type="button" class="btn btn-primary px-4">
                                    <i class="bi bi-shield-check me-1"></i> Validar datos
                                </button>
                            </div>
                        </form>

                        <div id="idResultado" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/validacionEstudiante.js" defer></script>
</body>

</html>
