<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <script src="../js/pedidos.js" defer></script>
</head>
<body class="bg-light">

  <header class="bg-dark text-white py-4 mb-4">
    <div class="container">
      <h1 class="h3 mb-1">Cafetería</h1>
      <p class="mb-0">Luis Mario Hernandez Ruiz</p>
    </div>
  </header>

  <main class="container pb-5">

    <section class="card shadow-sm mb-4" aria-labelledby="titulo-formulario">
      <div class="card-body">
        <h2 id="titulo-formulario" class="h5 mb-3">Nuevo pedido</h2>

        <form id="formulario-pedido" novalidate>
          <fieldset>
            <legend class="visually-hidden">Datos del pedido</legend>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="producto" class="form-label">Producto</label>
                <input type="text" id="producto" name="producto"
                       class="form-control" placeholder="Café americano" required>
              </div>
              <div class="col-md-3">
                <label for="precio" class="form-label">Precio unitario ($)</label>
                <input type="number" id="precio" name="precio"
                       class="form-control" step="0.01" placeholder="2.50" required>
              </div>
              <div class="col-md-3">
                <label for="cantidad" class="form-label">Cantidad</label>
                <input type="number" id="cantidad" name="cantidad"
                       class="form-control" step="1" placeholder="3" required>
              </div>
            </div>
          </fieldset>

          <button type="button" id="boton-agregar" class="btn btn-primary mt-3">
            Agregar pedido
          </button>
        </form>

        <p id="mensaje" class="mt-3 mb-0" role="alert" aria-live="polite"></p>
      </div>
    </section>

    <section class="card shadow-sm mb-4" aria-labelledby="titulo-filtro">
      <div class="card-body">
        <h2 id="titulo-filtro" class="h5 mb-3">Filtrar pedidos</h2>

        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label for="precio-maximo" class="form-label">Precio máximo ($)</label>
            <input type="number" id="precio-maximo" class="form-control"
                   step="0.01" placeholder="3.00">
          </div>
          <div class="col-md-8 d-flex flex-wrap gap-2">
            <button type="button" id="boton-filtrar" class="btn btn-secondary">
              Filtrar productos
            </button>
            <button type="button" id="boton-mostrar-todos" class="btn btn-outline-secondary">
              Mostrar todos
            </button>
            <button type="button" id="boton-limpiar" class="btn btn-outline-danger ms-md-auto">
              Limpiar pedidos
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="card shadow-sm" aria-labelledby="titulo-tabla">
      <div class="card-body">
        <h2 id="titulo-tabla" class="h5 mb-3">Listado de pedidos</h2>

        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <caption class="visually-hidden">Pedidos registrados en la cafetería</caption>
            <thead class="table-dark">
              <tr>
                <th scope="col">Producto</th>
                <th scope="col">Precio unitario</th>
                <th scope="col">Cantidad</th>
                <th scope="col">Subtotal</th>
              </tr>
            </thead>
            <tbody id="cuerpo-tabla"></tbody>
          </table>
        </div>

        <footer class="border-top pt-3">
          <dl class="row mb-0">
            <dt class="col-sm-4 col-md-3">Total de unidades</dt>
            <dd class="col-sm-8 col-md-9" id="total-unidades">0</dd>
            <dt class="col-sm-4 col-md-3">Monto total</dt>
            <dd class="col-sm-8 col-md-9 fw-bold" id="monto-total">$0.00</dd>
          </dl>
        </footer>
      </div>
    </section>

  </main>

</body>
</html>
