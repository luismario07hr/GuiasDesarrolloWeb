<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Pedidos - Cafetería</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

  <main class="container py-4">
    
    <header class="pb-3 mb-4 border-bottom">
      <h1 class="h3 fw-bold mb-1">Control de Pedidos — Cafetería</h1>
      <p class="text-secondary mb-0 small">Registro de órdenes y cálculo de subtotales</p>
    </header>

    <div class="row g-4">
      
      <!-- Panel izquierdo: Formulario de ingreso -->
      <aside class="col-md-4">
        <form id="formPedido" class="card p-3 border-secondary-subtle" novalidate>
          <h2 class="h5 mb-3 pb-2 border-bottom">Agregar orden</h2>

          <div id="alertaValidacion"></div>

          <fieldset class="mb-3">
            <label for="inputProducto" class="form-label">Producto</label>
            <input type="text" id="inputProducto" class="form-control" placeholder="Ej. Café americano" required>
            <small class="invalid-feedback">El nombre del producto es obligatorio.</small>
          </fieldset>

          <fieldset class="mb-3">
            <label for="inputPrecio" class="form-label">Precio unitario ($)</label>
            <input type="number" id="inputPrecio" class="form-control" placeholder="0.00" step="0.01" min="0.01" required>
            <small class="invalid-feedback">Ingrese un precio mayor a 0.</small>
          </fieldset>

          <fieldset class="mb-3">
            <label for="inputCantidad" class="form-label">Cantidad</label>
            <input type="number" id="inputCantidad" class="form-control" placeholder="1" step="1" min="1" required>
            <small class="invalid-feedback">Ingrese un número entero positivo.</small>
          </fieldset>

          <button type="submit" id="btnAgregar" class="btn btn-dark w-100 mt-1">
            Agregar pedido
          </button>
        </form>
      </aside>

      <!-- Panel derecho: Filtros, tabla y resumen -->
      <section class="col-md-8">
        
        <!-- Controles de filtrado -->
        <section class="card p-3 mb-3 border-secondary-subtle">
          <div class="row g-2 align-items-end">
            <div class="col-sm-4">
              <label for="inputPrecioMax" class="form-label small mb-1">Precio unitario máximo ($)</label>
              <input type="number" id="inputPrecioMax" class="form-control form-control-sm" placeholder="Ej. 3.50" step="0.01" min="0.01">
            </div>
            <div class="col-sm-8 d-flex gap-2 flex-wrap">
              <button type="button" id="btnFiltrar" class="btn btn-sm btn-secondary">
                Filtrar productos
              </button>
              <button type="button" id="btnMostrarTodos" class="btn btn-sm btn-outline-secondary">
                Mostrar todos
              </button>
              <button type="button" id="btnLimpiar" class="btn btn-sm btn-outline-danger ms-sm-auto">
                Limpiar pedidos
              </button>
            </div>
          </div>
          <div id="alertaFiltro" class="mt-2"></div>
        </section>

        <!-- Tabla de resultados e indicadores -->
        <article class="card border-secondary-subtle">
          <div class="table-responsive">
            <table class="table table-bordered table-hover mb-0 align-middle">
              <thead class="table-
